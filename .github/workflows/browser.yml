name: browser
# The browser runs (scripts/*-e2e.sh) that work on Linux, one job each, side by side (D194,
# docs/testing.md): nightly, on version tags and by hand — not on every push (each builds the
# dashboard and the binary and drives Chromium for minutes). They run as coverage builds (COVERAGE=1,
# D195) and send what they reach in Go to Codecov (flag go-e2e). A failed run's home, logs and
# screenshots are kept as an artifact.
#
# Mac-only (not here): every run that needs tests/fixtures/gen (made with macOS `say`: cards, generate,
# library, people, resources, sound, sources, storage, transcript, voiceover, voiceover-live, and acceptance)
# remote (its spoofing check sends from fe80::1%lo0; lo0 is macOS's loopback) and presenters (a presenter reads
# only sound MetaRush has listened to, which needs a recognizer on the computer: here `ingest --wait` ends saying the
# transcripts wait for one, and the presenter steps are refused). docs/testing.md lists why.
on:
  schedule:
    - cron: "23 4 * * *" # nightly, 04:23 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      suites:
        description: "Which runs (space separated, e.g. about playback); empty: every one listed below"
        required: false
        default: ""
jobs:
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write # Codecov through GitHub's OIDC: no token secret
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [about, abilities, accounts, catalogue, components, content, keep, playback, recipes, recorder, remotion, review-desk, windows]
    steps:
      - name: chosen?
        id: chosen
        env:
          SUITES: ${{ inputs.suites }}
          SUITE: ${{ matrix.suite }}
        run: |
          if [ -z "$SUITES" ] || [[ " $SUITES " == *" $SUITE "* ]]; then echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.chosen.outputs.run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.chosen.outputs.run
        with: { go-version: "1.27" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.chosen.outputs.run
        with: { node-version: 22 }
      # Ubuntu's mirror is sometimes very slow (scripts/ci-apt.sh): the package files an earlier run kept.
      - id: apt-cache
        if: steps.chosen.outputs.run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/apt-debs, key: apt-debs-, restore-keys: apt-debs- }
      - name: ffmpeg, bubblewrap, and where the run keeps its files
        if: steps.chosen.outputs.run
        run: |
          scripts/ci-apt.sh install ffmpeg bubblewrap
          # A Remotion refresh runs in bubblewrap (D174); Ubuntu's AppArmor stops unprivileged user namespaces
          # unless this is off, and MetaRush then refuses to plan one (remotion-e2e's refresh steps).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # The runs' temp folder outside the home folder (RUNNER_TEMP is inside the runner's home): an ability's
          # sandbox hides the home and refuses a room inside it, as on any computer.
          mkdir -p /tmp/e2e "$RUNNER_TEMP/e2e-runs"
          echo "TMPDIR=/tmp/e2e/" >> "$GITHUB_ENV"
          echo "METARUSH_E2E_RUNS=$RUNNER_TEMP/e2e-runs" >> "$GITHUB_ENV"
          echo "COVERAGE=1" >> "$GITHUB_ENV"
      - name: MongoDB as a one-member replica set (the dashboard's live updates need one)
        if: steps.chosen.outputs.run
        run: |
          scripts/ci-mongo.sh start
          scripts/ci-mongo.sh watch
      - name: packages and Chromium
        if: steps.chosen.outputs.run
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - id: apt
        if: steps.chosen.outputs.run
        run: scripts/ci-apt.sh keep
      - if: steps.chosen.outputs.run && steps.apt.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/apt-debs, key: "${{ steps.apt.outputs.key }}" }
      - name: scripts/${{ matrix.suite }}-e2e.sh
        if: steps.chosen.outputs.run
        run: scripts/${{ matrix.suite }}-e2e.sh
      - name: what became of MongoDB (after a failure)
        if: failure() && steps.chosen.outputs.run
        run: scripts/ci-mongo.sh report
      - name: coverage (Go, from every program the run started)
        if: always() && steps.chosen.outputs.run
        run: scripts/coverage.sh --no-check || true
      - name: coverage to Codecov (Go)
        if: always() && steps.chosen.outputs.run && hashFiles('.coverage/go-e2e.cov') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .coverage/go-e2e.cov
          flags: go-e2e
          name: browser-${{ matrix.suite }}-go
          disable_search: true
          fail_ci_if_error: false
      - name: coverage to Codecov (the dashboard's pages)
        if: always() && steps.chosen.outputs.run && hashFiles('.coverage/web-e2e.lcov') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .coverage/web-e2e.lcov
          flags: web-e2e
          name: browser-${{ matrix.suite }}-web
          disable_search: true
          fail_ci_if_error: false
      - name: what a failed run left (homes, logs, screenshots)
        if: failure() && steps.chosen.outputs.run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.suite }}
          path: |
            /tmp/e2e
            ${{ runner.temp }}/e2e-runs
            ${{ runner.temp }}/mongo
            .agent-home
            tests/out
            !**/renderer/**
            !**/node_modules/**
            !**/components/**
          if-no-files-found: ignore
          retention-days: 14
