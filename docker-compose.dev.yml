# Optional: local MongoDB replica set for development (alternative to scripts/dev-mongo.sh).
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["metarush-mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 5s
      retries: 20
volumes:
  metarush-mongo: {}
